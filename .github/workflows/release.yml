name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build and test tools
        run: python -m pip install --upgrade pip build twine pytest

      - name: Verify tag matches project version
        run: >-
          python -c "import os, pathlib, tomllib;
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'];
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version,
          (os.environ['GITHUB_REF_NAME'], version)"

      - name: Run source tests
        run: |
          python -m pip install -e ".[kafka,rabbitmq,mysql,postgres,mongodb,verification]"
          python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Test wheel installation
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/python -m pip check
          .venv-wheel/bin/python -c "import os, scrapy_cffi; assert 'v' + scrapy_cffi.__version__ == os.environ['GITHUB_REF_NAME']"
          .venv-wheel/bin/scrapy-cffi --help

      - name: Test source distribution installation
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install --upgrade pip
          .venv-sdist/bin/python -m pip install dist/*.tar.gz
          .venv-sdist/bin/python -m pip check
          .venv-sdist/bin/python -c "import os, scrapy_cffi; assert 'v' + scrapy_cffi.__version__ == os.environ['GITHUB_REF_NAME']"

      - name: Upload verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish immutable artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          user: __token__
          password: ${{ secrets.SCRAPY_CFFI }}
          packages-dir: dist/
