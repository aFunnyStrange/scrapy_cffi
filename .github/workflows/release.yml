name: Publish to PyPI / TestPyPI and GitHub Release

on:
  push:
    tags:
      - 'test*'
      - 'release*'
      - '*'  # 其他 tag 只跑 build

jobs:
  check-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify CHANGELOG.md contains current version
        run: |
          version="${GITHUB_REF_NAME#release-}"
          if [[ "$GITHUB_REF_NAME" == release* ]]; then
            echo "Checking CHANGELOG.md for version $version"
            if ! grep -q "## \[$version\]" CHANGELOG.md; then
              echo "❌ ERROR: CHANGELOG.md does not contain entry for $version"
              exit 1
            fi
          else
            echo "Skipping changelog check (not a release tag)"

  build-and-publish:
    runs-on: ubuntu-latest
    needs: check-changelog
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Clean __pycache__ and *.pyc files
        run: |
          find . -type d -name '__pycache__' -exec rm -rf {} +
          find . -type f -name '*.py[co]' -delete

      - name: Build the package (wheel + sdist)
        run: python -m build

      - name: Create source archive (zip + tar.gz)
        if: startsWith(github.ref_name, 'release')
        run: |
          version="${GITHUB_REF_NAME#release-}"
          version="${version#v}"  # 去掉可选 v 前缀
          project="scrapy_cffi"

          # zip 打包，排除 git, pycache, dist, *.egg-info
          zip -r "${project}-${version}.zip" . -x "*.git*" "*__pycache__*" "*.egg-info*" "*.pytest_cache*" "dist/*" "${project}-${version}.zip" "${project}-${version}.tar.gz"

          # tar.gz 打包，排除 git, pycache, dist, zip/tar.gz 自身
          tar --exclude-vcs \
              --exclude="__pycache__" \
              --exclude="*.egg-info" \
              --exclude="dist" \
              --exclude="${project}-${version}.zip" \
              --exclude="${project}-${version}.tar.gz" \
              -czf "${project}-${version}.tar.gz" .

      - name: Extract release notes from CHANGELOG.md
        id: release_notes
        run: |
          version="${GITHUB_REF_NAME#release-}"
          echo "Extracting notes for version $version"
          if [ -f CHANGELOG.md ]; then
            notes=$(awk "/## \\[$version\\]/ {flag=1; next} /^## \\[/ && flag {flag=0} flag" CHANGELOG.md)
          fi
          if [ -z "$notes" ]; then
            notes="- No changelog entry found for $version"
          fi
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Conditional Publish to PyPI / TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD_TEST: ${{ secrets.SCRAPY_CFFI_TEST }}
          TWINE_PASSWORD_RELEASE: ${{ secrets.SCRAPY_CFFI }}
        run: |
          echo "Git tag: $GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" == test* ]]; then
            echo "Publishing to TestPyPI..."
            export TWINE_PASSWORD=$TWINE_PASSWORD_TEST
            twine upload --repository-url https://test.pypi.org/legacy/ dist/*
          elif [[ "$GITHUB_REF_NAME" == release* ]]; then
            echo "Publishing to PyPI..."
            export TWINE_PASSWORD=$TWINE_PASSWORD_RELEASE
            twine upload dist/*
          else
            echo "Tag does not match test* or release*, skipping PyPI upload."

      - name: Generate SHA256 checksums
        if: startsWith(github.ref_name, 'release')
        run: |
          for file in dist/* "${project}-${version}.zip" "${project}-${version}.tar.gz"; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256"
            fi
          done

      - name: Create GitHub Release
        if: startsWith(github.ref_name, 'release')
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.content }}
          draft: false
          prerelease: false

      - name: Upload Release Assets
        if: startsWith(github.ref_name, 'release')
        run: |
          for file in dist/* "${project}-${version}.zip" "${project}-${version}.tar.gz"; do
            if [ -f "$file" ]; then
              echo "Uploading $file ..."
              gh release upload "${GITHUB_REF_NAME}" "$file" "$file.sha256" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
