name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[kafka,rabbitmq,mysql,postgres,mongodb]" pytest
      - name: Test
        run: python -m pytest -q

  python-314-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip check
      - name: Core compatibility smoke test
        run: |
          python -m pytest tests/test_python39_compatibility.py -q
          scrapy-cffi --help
