name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[kafka,rabbitmq,mysql,postgres,mongodb,verification]"
      - name: Test
        run: python -m pytest -q

  python-314-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip check
      - name: Core compatibility smoke test
        run: |
          python -m pytest tests/test_python39_compatibility.py -q
          scrapy-cffi --help

  curl-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            curl-version: "0.7.4"
          - python-version: "3.9"
            curl-version: "0.13.0"
          - python-version: "3.13"
            curl-version: "0.15.0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install qualified curl_cffi lane
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip install --force-reinstall "curl_cffi==${{ matrix.curl-version }}"
      - name: Verify platform and persistent-session compatibility
        run: |
          python -c "import curl_cffi; assert curl_cffi.__version__ == '${{ matrix.curl-version }}'"
          python -m pytest tests/test_http_platform.py tests/test_scheduler_persistence.py -q
