# Production connection example only. These are real machine/DNS endpoints,
# not crawler-owned Docker services. Translate the selected section into
# SettingsInfo or your generated .env file.

[redis.single]
url = "rediss://crawler:replace-me@redis.internal:6379/0"

[mysql]
url = "mysql+asyncmy://crawler:replace-me@mysql.internal:3306/app_db"

[postgres]
url = "postgresql+asyncpg://crawler:replace-me@postgres.internal:5432/app_db"

[mongodb]
url = "mongodb://crawler:replace-me@mongodb.internal:27017/app_db?authSource=admin"

[redis.sentinel]
master_name = "mymaster"
sentinel_hosts = [
  "redis-sentinel-01.internal:26379",
  "redis-sentinel-02.internal:26379",
  "redis-sentinel-03.internal:26379",
]
username = "crawler"
password = "replace-me"
sentinel_username = "sentinel-crawler"
sentinel_password = "replace-me"

[redis.cluster]
startup_nodes = [
  "redis-cluster-01.internal:6379",
  "redis-cluster-02.internal:6379",
  "redis-cluster-03.internal:6379",
]
username = "crawler"
password = "replace-me"
ssl = true

[rabbitmq.cluster]
nodes = [
  "amqps://crawler:replace-me@rabbitmq-01.internal:5671/scrapy",
  "amqps://crawler:replace-me@rabbitmq-02.internal:5671/scrapy",
  "amqps://crawler:replace-me@rabbitmq-03.internal:5671/scrapy",
]
exchange = "scrapy_cffi"
ingress_queue = "scrapy_cffi"

[kafka.cluster]
bootstrap = [
  "kafka-01.internal:9093",
  "kafka-02.internal:9093",
  "kafka-03.internal:9093",
]
security_protocol = "SASL_SSL"
sasl_mechanism = "SCRAM-SHA-512"
sasl_username = "crawler"
sasl_password = "replace-me"
ssl_cafile = "/run/secrets/infra-ca.pem"
replication_factor = 3
