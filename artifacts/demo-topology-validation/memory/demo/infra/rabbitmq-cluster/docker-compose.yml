services:
  rabbit1:
    image: rabbitmq:3.13-management
    hostname: rabbit1
    environment:
      RABBITMQ_ERLANG_COOKIE: MY_SECRET_COOKIE
      RABBITMQ_NODENAME: rabbit@rabbit1
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports: ["5672:5672", "15672:15672", "25672:25672"]
    volumes:
      - rabbit1_data:/var/lib/rabbitmq
      - ./rabbitmq-entrypoint.sh:/usr/local/bin/rabbitmq-entrypoint.sh:ro
    command: ["/usr/bin/env", "bash", "/usr/local/bin/rabbitmq-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  rabbit2:
    image: rabbitmq:3.13-management
    hostname: rabbit2
    environment:
      RABBITMQ_ERLANG_COOKIE: MY_SECRET_COOKIE
      RABBITMQ_NODENAME: rabbit@rabbit2
      CLUSTER_MASTER: rabbit1
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports: ["5673:5672", "15673:15672", "25673:25672"]
    depends_on:
      rabbit1:
        condition: service_healthy
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
      - ./rabbitmq-entrypoint.sh:/usr/local/bin/rabbitmq-entrypoint.sh:ro
    command: ["/usr/bin/env", "bash", "/usr/local/bin/rabbitmq-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  rabbit3:
    image: rabbitmq:3.13-management
    hostname: rabbit3
    environment:
      RABBITMQ_ERLANG_COOKIE: MY_SECRET_COOKIE
      RABBITMQ_NODENAME: rabbit@rabbit3
      CLUSTER_MASTER: rabbit1
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports: ["5674:5672", "15674:15672", "25674:25672"]
    depends_on:
      rabbit1:
        condition: service_healthy
    volumes:
      - rabbit3_data:/var/lib/rabbitmq
      - ./rabbitmq-entrypoint.sh:/usr/local/bin/rabbitmq-entrypoint.sh:ro
    command: ["/usr/bin/env", "bash", "/usr/local/bin/rabbitmq-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  rabbit1_data:
  rabbit2_data:
  rabbit3_data:
