services:
  redis-node1:
    image: redis:7
    command: >
      redis-server --port 7000 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0
      --cluster-announce-hostname redis-node1 --cluster-preferred-endpoint-type hostname
      --cluster-announce-port 7000 --cluster-announce-bus-port 17000
    ports: ["7000:7000", "17000:17000"]
    healthcheck: { test: ["CMD", "redis-cli", "-p", "7000", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  redis-node2:
    image: redis:7
    command: >
      redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0
      --cluster-announce-hostname redis-node2 --cluster-preferred-endpoint-type hostname
      --cluster-announce-port 7001 --cluster-announce-bus-port 17001
    ports: ["7001:7001", "17001:17001"]
    healthcheck: { test: ["CMD", "redis-cli", "-p", "7001", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  redis-node3:
    image: redis:7
    command: >
      redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0
      --cluster-announce-hostname redis-node3 --cluster-preferred-endpoint-type hostname
      --cluster-announce-port 7002 --cluster-announce-bus-port 17002
    ports: ["7002:7002", "17002:17002"]
    healthcheck: { test: ["CMD", "redis-cli", "-p", "7002", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  redis-node4:
    image: redis:7
    command: >
      redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0
      --cluster-announce-hostname redis-node4 --cluster-preferred-endpoint-type hostname
      --cluster-announce-port 7003 --cluster-announce-bus-port 17003
    ports: ["7003:7003", "17003:17003"]
    healthcheck: { test: ["CMD", "redis-cli", "-p", "7003", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  redis-node5:
    image: redis:7
    command: >
      redis-server --port 7004 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0
      --cluster-announce-hostname redis-node5 --cluster-preferred-endpoint-type hostname
      --cluster-announce-port 7004 --cluster-announce-bus-port 17004
    ports: ["7004:7004", "17004:17004"]
    healthcheck: { test: ["CMD", "redis-cli", "-p", "7004", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  redis-node6:
    image: redis:7
    command: >
      redis-server --port 7005 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0
      --cluster-announce-hostname redis-node6 --cluster-preferred-endpoint-type hostname
      --cluster-announce-port 7005 --cluster-announce-bus-port 17005
    ports: ["7005:7005", "17005:17005"]
    healthcheck: { test: ["CMD", "redis-cli", "-p", "7005", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  redis-cluster-init:
    image: redis:7
    depends_on:
      redis-node1: { condition: service_healthy }
      redis-node2: { condition: service_healthy }
      redis-node3: { condition: service_healthy }
      redis-node4: { condition: service_healthy }
      redis-node5: { condition: service_healthy }
      redis-node6: { condition: service_healthy }
    volumes:
      - ./cluster-init.sh:/usr/local/bin/cluster-init.sh:ro
    command: ["sh", "/usr/local/bin/cluster-init.sh"]
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -h redis-node1 -p 7000 cluster info | grep -q 'cluster_state:ok'
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped
