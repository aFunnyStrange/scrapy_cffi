<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">scrapy-cffi system overview</title>
  <desc id="desc">Task ingress, crawler runtime, editable components, shared resources, and persistence boundaries.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker>
    <style>.box{stroke:#334155;stroke-width:2;rx:16}.title{font:700 26px system-ui,sans-serif;fill:#0f172a}.label{font:600 20px system-ui,sans-serif;fill:#0f172a}.small{font:16px system-ui,sans-serif;fill:#334155}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">scrapy-cffi system boundaries</text>
  <rect x="50" y="115" width="210" height="100" class="box" fill="#fef3c7"/><text x="155" y="155" text-anchor="middle" class="label">Task producers</text><text x="155" y="184" text-anchor="middle" class="small">app / API / scheduler</text>
  <rect x="350" y="115" width="235" height="100" class="box" fill="#fed7aa"/><text x="467" y="155" text-anchor="middle" class="label">Ingress transport</text><text x="467" y="184" text-anchor="middle" class="small">Redis / RabbitMQ / Kafka</text>
  <rect x="685" y="95" width="250" height="140" class="box" fill="#dbeafe"/><text x="810" y="145" text-anchor="middle" class="label">Crawler runtime</text><text x="810" y="177" text-anchor="middle" class="small">Crawler → Engines</text><text x="810" y="205" text-anchor="middle" class="small">per-spider Schedulers</text>
  <rect x="1000" y="115" width="155" height="100" class="box" fill="#cffafe"/><text x="1077" y="155" text-anchor="middle" class="label">Targets</text><text x="1077" y="184" text-anchor="middle" class="small">HTTP / WS / SSE</text>
  <path d="M260 165H350M585 165H685M935 165H1000" class="arrow"/>

  <rect x="75" y="380" width="290" height="150" class="box" fill="#fee2e2"/><text x="220" y="420" text-anchor="middle" class="label">Editable components</text><text x="220" y="452" text-anchor="middle" class="small">Spiders + interceptors</text><text x="220" y="480" text-anchor="middle" class="small">Pipelines + signal extensions</text><text x="220" y="508" text-anchor="middle" class="small">all receive the same resources</text>
  <rect x="455" y="380" width="290" height="150" class="box" fill="#dcfce7"/><text x="600" y="420" text-anchor="middle" class="label">ResourceService</text><text x="600" y="452" text-anchor="middle" class="small">built-in + custom resources</text><text x="600" y="480" text-anchor="middle" class="small">bounded retry + replacement</text><text x="600" y="508" text-anchor="middle" class="small">runtime-owned lifecycle</text>
  <rect x="835" y="360" width="290" height="190" class="box" fill="#f3e8ff"/><text x="980" y="400" text-anchor="middle" class="label">Infrastructure</text><text x="980" y="432" text-anchor="middle" class="small">Redis: task / transient state</text><text x="980" y="460" text-anchor="middle" class="small">SQL / Mongo: durable records</text><text x="980" y="488" text-anchor="middle" class="small">RabbitMQ / Kafka: messages</text><text x="980" y="522" text-anchor="middle" class="small">one-shot vendor clients</text>
  <path d="M760 235Q660 300 365 410" class="arrow"/><path d="M810 235Q760 320 710 380" class="arrow"/><path d="M365 455H455" class="arrow"/><path d="M745 455H835" class="arrow"/>
  <text x="600" y="610" text-anchor="middle" class="small">Queue session_id values stay lightweight; account and device facts are loaded from durable databases when needed.</text>
  <text x="600" y="642" text-anchor="middle" class="small">Session cookies are not copied into Redis unless SCHEDULER_PERSIST_SESSIONS is explicitly enabled.</text>
</svg>
