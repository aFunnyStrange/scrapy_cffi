services:
  redis-master:
    image: redis:7
    command: redis-server --appendonly yes --bind 0.0.0.0
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  redis-slave1:
    image: redis:7
    command: sh -c "sleep 3 && redis-server --replicaof redis-master 6379"
    ports:
      - "6380:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    restart: unless-stopped

  redis-slave2:
    image: redis:7
    command: sh -c "sleep 3 && redis-server --replicaof redis-master 6379"
    ports:
      - "6381:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    restart: unless-stopped

  sentinel1:
    image: redis:7
    environment:
      - MASTER_HOST=redis-master
      - SENTINEL_PORT=26379
    volumes:
      - ./sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
    command: sh /usr/local/bin/sentinel-entrypoint.sh
    ports:
      - "26379:26379"
    depends_on:
      redis-master:
        condition: service_healthy
    restart: unless-stopped

  sentinel2:
    image: redis:7
    environment:
      - MASTER_HOST=redis-master
      - SENTINEL_PORT=26379
    volumes:
      - ./sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
    command: sh /usr/local/bin/sentinel-entrypoint.sh
    ports:
      - "26380:26379"
    depends_on:
      redis-master:
        condition: service_healthy
    restart: unless-stopped

  sentinel3:
    image: redis:7
    environment:
      - MASTER_HOST=redis-master
      - SENTINEL_PORT=26379
    volumes:
      - ./sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
    command: sh /usr/local/bin/sentinel-entrypoint.sh
    ports:
      - "26381:26379"
    depends_on:
      redis-master:
        condition: service_healthy
    restart: unless-stopped
