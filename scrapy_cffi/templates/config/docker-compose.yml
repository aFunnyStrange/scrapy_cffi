services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "runner.py"]
    restart: unless-stopped

    # The crawler container owns no database or message-queue lifecycle.
    # Configure external Redis/MySQL/PostgreSQL/MongoDB/RabbitMQ/Kafka addresses
    # in settings.py, or uncomment the optional env file below.
    # env_file:
    #   - ../.env.dev
