services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "runner.py"]
    restart: unless-stopped

    # The crawler container owns no database or message-queue lifecycle.
    # Keep readable operational configuration and local secrets in ../.env.
    # Process environment has the highest precedence.
    # env_file:
    #   - ../.env
