# Framework-side connection templates for broker integration.
# Copy the needed block into your runtime settings and adjust hosts/ports.

[single.redis]
SCHEDULER = "scrapy_cffi.scheduler.RedisScheduler"
REDIS_INFO = { MODE = "single", URL = "redis://127.0.0.1:6379/0" }

[single.rabbitmq]
SCHEDULER = "scrapy_cffi.scheduler.RabbitMqScheduler"
RABBITMQ_INFO = { MODE = "single", URL = "amqp://guest:guest@127.0.0.1:5672/", EXCHANGE_NAME = "scrapy_cffi", EXCHANGE_TYPE = "direct", PREFETCH_COUNT = 10 }

[single.kafka]
KAFKA_INFO = { MODE = "single", URL = "127.0.0.1:9092", CONSUMER_GROUP = "scrapy_cffi", PERSISTENT_TIME = 604800000 }

[sentinel.redis]
SCHEDULER = "scrapy_cffi.scheduler.RedisScheduler"
REDIS_INFO = { MODE = "sentinel", SENTINELS = [["127.0.0.1", 26379], ["127.0.0.1", 26380], ["127.0.0.1", 26381]], MASTER_NAME = "mymaster", SENTINEL_OVERRIDE_MASTER = ["127.0.0.1", 6379] }

[cluster.redis]
SCHEDULER = "scrapy_cffi.scheduler.RedisScheduler"
REDIS_INFO = { MODE = "cluster", CLUSTER_NODES = [{ host = "127.0.0.1", port = 7000 }, { host = "127.0.0.1", port = 7001 }, { host = "127.0.0.1", port = 7002 }, { host = "127.0.0.1", port = 7003 }, { host = "127.0.0.1", port = 7004 }, { host = "127.0.0.1", port = 7005 }] }

[cluster.rabbitmq]
SCHEDULER = "scrapy_cffi.scheduler.RabbitMqScheduler"
RABBITMQ_INFO = { MODE = "cluster", CLUSTER_NODES = ["amqp://guest:guest@127.0.0.1:5672/", "amqp://guest:guest@127.0.0.1:5673/", "amqp://guest:guest@127.0.0.1:5674/"], EXCHANGE_NAME = "scrapy_cffi", EXCHANGE_TYPE = "direct", PREFETCH_COUNT = 10 }

[cluster.kafka]
KAFKA_INFO = { MODE = "cluster", CLUSTER_NODES = ["127.0.0.1:9094", "127.0.0.1:9095", "127.0.0.1:9096"], CONSUMER_GROUP = "scrapy_cffi", PERSISTENT_TIME = 604800000 }
