x-kafka-common: &kafka-common
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:19093,2@kafka2:19093,3@kafka3:19093
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

services:
  kafka1:
    image: apache/kafka:4.3.1
    hostname: kafka1
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://127.0.0.1:9094
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["9094:9092"]
    volumes: ["kafka1_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:19092"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka2:
    image: apache/kafka:4.3.1
    hostname: kafka2
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:19092,EXTERNAL://127.0.0.1:9095
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["9095:9092"]
    volumes: ["kafka2_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:19092"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka3:
    image: apache/kafka:4.3.1
    hostname: kafka3
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:19092,EXTERNAL://127.0.0.1:9096
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["9096:9092"]
    volumes: ["kafka3_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:19092"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
