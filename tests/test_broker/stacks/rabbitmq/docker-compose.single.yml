# Single RabbitMQ — one container (stop any other broker using 5672 first).
#   docker compose -f tests/test_broker/stacks/rabbitmq/docker-compose.single.yml up -d
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-single-test
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
