version: "3.9"

networks:
  rediscluster_net:
    driver: bridge

services:
  # Master Nodes
  redis-node1:
    image: redis:7
    container_name: redis-node1
    command: sh -c "sleep 2 && redis-server /usr/local/etc/redis/redis.conf"
    ports:
      - "7000:7000"
      - "17000:17000"
    networks:
      - rediscluster_net
    volumes:
      - ./cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh
      - ./conf/node1.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node2:
    image: redis:7
    container_name: redis-node2
    command: sh -c "sleep 2 && redis-server /usr/local/etc/redis/redis.conf"
    ports:
      - "7001:7001"
      - "17001:17001"
    networks:
      - rediscluster_net
    volumes:
      - ./cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh
      - ./conf/node2.conf:/usr/local/etc/redis/redis.conf
    depends_on:
      - redis-node1
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node3:
    image: redis:7
    container_name: redis-node3
    command: sh -c "sleep 2 && redis-server /usr/local/etc/redis/redis.conf"
    ports:
      - "7002:7002"
      - "17002:17002"
    networks:
      - rediscluster_net
    volumes:
      - ./cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh
      - ./conf/node3.conf:/usr/local/etc/redis/redis.conf
    depends_on:
      - redis-node1
      - redis-node2
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Slaves
  redis-node4:
    image: redis:7
    container_name: redis-node4
    command: sh -c "sleep 5 && redis-server /usr/local/etc/redis/redis.conf"
    ports:
      - "7003:7003"
      - "17003:17003"
    networks:
      - rediscluster_net
    volumes:
      - ./cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh
      - ./conf/node4.conf:/usr/local/etc/redis/redis.conf
    depends_on:
      - redis-node1
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node5:
    image: redis:7
    container_name: redis-node5
    command: sh -c "sleep 5 && redis-server /usr/local/etc/redis/redis.conf"
    ports:
      - "7004:7004"
      - "17004:17004"
    networks:
      - rediscluster_net
    volumes:
      - ./cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh
      - ./conf/node5.conf:/usr/local/etc/redis/redis.conf
    depends_on:
      - redis-node2
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7004", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node6:
    image: redis:7
    container_name: redis-node6
    command: sh -c "sleep 5 && redis-server /usr/local/etc/redis/redis.conf"
    ports:
      - "7005:7005"
      - "17005:17005"
    networks:
      - rediscluster_net
    volumes:
      - ./cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh
      - ./conf/node6.conf:/usr/local/etc/redis/redis.conf
    depends_on:
      - redis-node3
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
