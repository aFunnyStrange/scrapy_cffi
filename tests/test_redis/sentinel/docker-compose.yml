networks:
  redisnet:
    driver: bridge # overlay

services:
  # Master
  redis-master:
    image: redis:7
    container_name: redis-master
    command: redis-server --appendonly yes --bind 0.0.0.0
    ports:
      - "6379:6379"
    networks:
      - redisnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Slaves
  redis-slave1:
    image: redis:7
    container_name: redis-slave1
    command: sh -c "sleep 3 && redis-server --replicaof redis-master 6379"
    ports:
      - "6380:6379"
    depends_on:
      - redis-master
    networks:
      - redisnet
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-slave2:
    image: redis:7
    container_name: redis-slave2
    command: sh -c "sleep 3 && redis-server --replicaof redis-master 6379"
    ports:
      - "6381:6379"
    depends_on:
      - redis-master
    networks:
      - redisnet
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Sentinels
  sentinel1:
    image: redis:7
    container_name: sentinel1
    environment:
      - MASTER_HOST=redis-master
      - SENTINEL_PORT=26379
      - HOST_IP=<PUBLIC_IP>
    volumes:
      - ./sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh
    command: sh /usr/local/bin/sentinel-entrypoint.sh
    ports:
      - "26379:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave1:
        condition: service_started
      redis-slave2:
        condition: service_started
    networks:
      - redisnet

  sentinel2:
    image: redis:7
    container_name: sentinel2
    environment:
      - MASTER_HOST=redis-master
      - SENTINEL_PORT=26379
      - HOST_IP=<PUBLIC_IP>
    volumes:
      - ./sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh
    command: sh /usr/local/bin/sentinel-entrypoint.sh
    ports:
      - "26380:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave1:
        condition: service_started
      redis-slave2:
        condition: service_started
    networks:
      - redisnet

  sentinel3:
    image: redis:7
    container_name: sentinel3
    environment:
      - MASTER_HOST=redis-master
      - SENTINEL_PORT=26379
      - HOST_IP=<PUBLIC_IP>
    volumes:
      - ./sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh
    command: sh /usr/local/bin/sentinel-entrypoint.sh
    ports:
      - "26381:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave1:
        condition: service_started
      redis-slave2:
        condition: service_started
    networks:
      - redisnet
